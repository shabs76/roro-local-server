services:
  db:
    image: mariadb:10.6
    container_name: roro-mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Same clock as the app, so times written by MariaDB (NOW()) and by the server match.
      - TZ=${TZ:-Africa/Dar_es_Salaam}
    volumes:
      # Persist database data across container restarts
      - db_data:/var/lib/mysql
      # Creates all tables the first time the database volume is created (an empty
      # db_data volume). Later starts keep the existing data and skip this file.
      - ./roro_local.sql:/docker-entrypoint-initdb.d/01_roro_local.sql:ro
    ports:
      # Reachable from this machine only. Tablets talk to the app on port 4400, never to
      # the database, and Docker-published ports are not covered by the host firewall.
      - "127.0.0.1:3306:3306"
    healthcheck:
      # Passes once MariaDB accepts TCP connections. On the first start that happens only
      # after roro_local.sql has been loaded.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: roro_phpmyadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=300M
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roro_app
    restart: unless-stopped
    ports:
      - "4400:4400"
    env_file:
      - src/.env
    environment:
      # Override the DB host from src/.env because in docker the database is reachable via 'db' instead of 'localhost'
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - TZ=${TZ:-Africa/Dar_es_Salaam}
    volumes:
      # Photos, videos and documents the tablets upload
      - ./src/media_data:/app/src/media_data
      # server.log, rotated by the server
      - ./src/logs:/app/src/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
